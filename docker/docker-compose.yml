name: signalops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-signalops}
      POSTGRES_USER: ${DB_USER:-signalops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-signalops}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-signalops} -d ${DB_NAME:-signalops}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ../backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-signalops}
      DB_USER: ${DB_USER:-signalops}
      DB_PASSWORD: ${DB_PASSWORD:-signalops}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in docker/.env (base64 of >=32 random bytes)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-true}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local,demo}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}/api/v1
        NEXT_PUBLIC_WS_URL: ws://localhost:${BACKEND_PORT:-8080}/ws
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
volumes:
  postgres-data:
