<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="64" height="64">
  <defs>
    <linearGradient id="sig-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="sig-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#sig-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  
  <!-- Radar Wave Rings (Subtle) -->
  <circle cx="32" cy="32" r="22" stroke="white" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 3" />
  <circle cx="32" cy="32" r="14" stroke="white" stroke-opacity="0.15" stroke-width="1" />

  <!-- Signal Pulse Waveform with Glow -->
  <path
    d="M 12 33 L 21 33 L 26 16 L 33 46 L 39 25 L 44 33 L 52 33"
    stroke="url(#sig-glow)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  <path
    d="M 12 33 L 21 33 L 26 16 L 33 46 L 39 25 L 44 33 L 52 33"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Active Telemetry Nodes -->
  <circle cx="26" cy="16" r="3" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="33" cy="46" r="3" fill="#F43F5E" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="39" cy="25" r="2.5" fill="#4ADE80" stroke="#FFFFFF" stroke-width="1.2" />
</svg>
