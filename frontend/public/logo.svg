<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none" width="240" height="56">
  <defs>
    <linearGradient id="logo-sig-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="logo-pulse-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="logo-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <!-- Mark Container (x=4, y=4, w=48, h=48) -->
  <g transform="translate(4, 4)">
    <rect width="48" height="48" rx="13" fill="url(#logo-sig-bg)" />
    <rect width="48" height="48" rx="13" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" />
    
    <!-- Radar ring -->
    <circle cx="24" cy="24" r="17" stroke="white" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 3" />
    <circle cx="24" cy="24" r="10" stroke="white" stroke-opacity="0.15" stroke-width="1" />

    <!-- Pulse Wave -->
    <path
      d="M 8 25 L 15 25 L 19 12 L 25 36 L 29 19 L 33 25 L 40 25"
      stroke="url(#logo-pulse-glow)"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 8 25 L 15 25 L 19 12 L 25 36 L 29 19 L 33 25 L 40 25"
      stroke="#FFFFFF"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="19" cy="12" r="2.2" fill="#38BDF8" />
    <circle cx="25" cy="36" r="2.2" fill="#F43F5E" />
    <circle cx="29" cy="19" r="2" fill="#4ADE80" />
  </g>

  <!-- Typography -->
  <text x="64" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.5" fill="currentColor">
    Signal<tspan fill="url(#logo-text-grad)">Ops</tspan>
  </text>
  
  <text x="65" y="45" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.8" fill="#818CF8" text-transform="uppercase" opacity="0.9">
    Incident Control
  </text>
</svg>
