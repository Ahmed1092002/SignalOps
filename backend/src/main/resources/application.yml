spring:
  application:
    name: signalops-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/signalops}
    username: ${DB_USER:signalops}
    password: ${DB_PASSWORD:signalops}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB

server:
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

signalops:
  security:
    jwt-secret: ${JWT_SECRET:}
    access-ttl: ${ACCESS_TTL:PT15M}
    refresh-ttl: ${REFRESH_TTL:P7D}
    cookie-secure: ${COOKIE_SECURE:false}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    enabled: ${SEED_DEMO:false}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
